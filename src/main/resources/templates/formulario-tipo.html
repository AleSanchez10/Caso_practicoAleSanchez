
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/plantilla :: head}">
    <title>Formulario Tipo de Servicio</title>
</head>

<body>

<header th:replace="~{fragments/plantilla :: header}"></header>

<nav th:replace="~{fragments/plantilla :: navbar}"></nav>

<main class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3 class="mb-0">Tipo de Servicio</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/tipos/guardar}"
                  th:object="${tipoServicio}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre del tipo de servicio
                    </label>

                    <input type="text"
                           id="nombre"
                           class="form-control"
                           th:field="*{nombre}"
                           maxlength="100"
                           required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">
                        Descripción
                    </label>

                    <textarea id="descripcion"
                              class="form-control"
                              th:field="*{descripcion}"
                              maxlength="255"
                              rows="4"></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Guardar
                </button>

                <a th:href="@{/tipos}" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>
    </div>

</main>

<footer th:replace="~{fragments/plantilla :: footer}"></footer>

</body>
</html>
