
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/plantilla :: head}">
    <title>Formulario de Servicio</title>
</head>

<body>

<header th:replace="~{fragments/plantilla :: header}"></header>
<nav th:replace="~{fragments/plantilla :: navbar}"></nav>

<main class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3 class="mb-0">Servicio Veterinario</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/servicios/guardar}"
                  th:object="${servicio}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre del servicio
                    </label>

                    <input type="text"
                           id="nombre"
                           class="form-control"
                           th:field="*{nombre}"
                           maxlength="100"
                           required>
                </div>

                <div class="mb-3">
                    <label for="tipoServicio" class="form-label">
                        Tipo de servicio
                    </label>

                    <select id="tipoServicio"
                            class="form-select"
                            th:field="*{tipoServicio.id}"
                            required>

                        <option value="">Seleccione un tipo</option>

                        <option th:each="tipo : ${tipos}"
                                th:value="${tipo.id}"
                                th:text="${tipo.nombre}">
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">
                        Precio
                    </label>

                    <input type="number"
                           id="precio"
                           class="form-control"
                           th:field="*{precio}"
                           step="0.01"
                           min="0"
                           required>
                </div>

                <div class="mb-3">
                    <label for="duracionMinutos" class="form-label">
                        Duración en minutos
                    </label>

                    <input type="number"
                           id="duracionMinutos"
                           class="form-control"
                           th:field="*{duracionMinutos}"
                           min="1"
                           required>
                </div>

                <button type="submit" class="btn btn-success">
                    Guardar
                </button>

                <a th:href="@{/servicios}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>
    </div>

</main>

<footer th:replace="~{fragments/plantilla :: footer}"></footer>

</body>
</html>
