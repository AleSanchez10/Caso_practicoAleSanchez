
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/plantilla :: head}">
    <title>Contacto</title>
</head>

<body>

<header th:replace="~{fragments/plantilla :: header}"></header>

<nav th:replace="~{fragments/plantilla :: navbar}"></nav>

<main class="container mt-5">

    <h2 class="mb-4">Consultas Veterinarias</h2>

    <div th:if="${exito}"
         class="alert alert-success"
         th:text="${exito}">
    </div>

    <div class="card shadow">
        <div class="card-body">

            <form th:action="@{/contacto}" method="post">

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre
                    </label>
                    <input type="text"
                           id="nombre"
                           name="nombre"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">
                        Correo electrónico
                    </label>
                    <input type="email"
                           id="correo"
                           name="correo"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="mascota" class="form-label">
                        Nombre de la mascota
                    </label>
                    <input type="text"
                           id="mascota"
                           name="mascota"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">
                        Mensaje
                    </label>
                    <textarea id="mensaje"
                              name="mensaje"
                              class="form-control"
                              rows="4"
                              required></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Enviar consulta
                </button>

            </form>

        </div>
    </div>

</main>

<footer th:replace="~{fragments/plantilla :: footer}"></footer>

</body>
</html>
