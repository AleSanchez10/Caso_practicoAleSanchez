
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="#{sitio.titulo}">Clínica Veterinaria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <!-- Encabezado -->
    <header th:fragment="header"
            class="bg-success text-white text-center p-4">
        <h1 th:text="#{sitio.titulo}">Clínica Veterinaria</h1>
        <p th:text="#{sitio.subtitulo}">
            Cuidamos a tus mascotas
        </p>
    </header>

    <!-- Barra de navegación -->
    <nav th:fragment="navbar"
         class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}"
               th:text="#{menu.marca}">Veterinaria</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav">
                    <a class="nav-link" th:href="@{/}"
                       th:text="#{menu.inicio}">Inicio</a>

                    <a class="nav-link" th:href="@{/tipos}"
                       th:text="#{menu.tipos}">Tipos de servicio</a>

                    <a class="nav-link" th:href="@{/servicios}"
                       th:text="#{menu.servicios}">Servicios</a>

                    <a class="nav-link" th:href="@{/citas}"
                       th:text="#{menu.citas}">Citas</a>

                    <a class="nav-link" th:href="@{/contacto}"
                       th:text="#{menu.contacto}">Contacto</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Pie de página -->
    <footer th:fragment="footer"
            class="bg-dark text-white text-center p-4 mt-5">
        <p class="mb-0" th:text="#{sitio.footer}">
            Clínica Veterinaria
        </p>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </footer>

</body>
</html>
